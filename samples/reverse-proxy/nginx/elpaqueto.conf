# Example nginx configuration for ElPaqueto at https://nuget.example.test.
# Include it in the http {} context (the official image loads /etc/nginx/conf.d/*.conf).
# Explained in docs/user/reverse-proxy.md. Checked in CI with `nginx -t` (eng/docker/validate-proxy-samples.sh).

upstream elpaqueto {
    # The Compose service name and its container port. Not published on the host.
    server elpaqueto:8080;
    keepalive 16;
}

# Any other host name or a bare IP address on port 443: refuse the TLS handshake, so that only
# nuget.example.test reaches ElPaqueto.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nuget.example.test;

    # TLS ends here. Use the certificate of your public host name (for example from an ACME client).
    ssl_certificate     /etc/nginx/certs/nuget.example.test.crt;
    ssl_certificate_key /etc/nginx/certs/nuget.example.test.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Body size: at least MaxPackageSizeGiB (8 GiB by default). nginx's own default is 1 MiB.
    client_max_body_size 8g;
    # Stream uploads to ElPaqueto instead of storing them on the proxy's disk first.
    proxy_request_buffering off;

    # Long pushes and downloads of large packages.
    client_body_timeout 300s;
    proxy_send_timeout  300s;
    proxy_read_timeout  300s;

    location / {
        proxy_pass http://elpaqueto;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;

        # Overwrite whatever the client sent: ElPaqueto trusts these headers from this proxy only.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # Appends the client address to the list; ElPaqueto reads the entry this proxy added.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # The Authorization and X-NuGet-ApiKey headers pass through unchanged (nginx's default).
        # Do not add auth_basic or any other authentication on this location.
    }
}

# Plain HTTP. Preferably do not listen on port 80 for the feed's host name at all. If you do, redirect only a
# browser's bare "GET /" and answer everything else with an error: a client that follows a redirect sends
# its credentials again.
server {
    listen 80;
    listen [::]:80;
    server_name nuget.example.test;

    location = / {
        if ($request_method != GET) {
            return 404;
        }
        return 301 https://nuget.example.test/;
    }

    location / {
        return 404;
    }
}
