name: Docker

# Builds the container image, checks its runtime contract with a smoke test, scans it for known
# vulnerabilities and validates the Compose and reverse-proxy samples. Nothing is pushed to any registry.
# Every job is read-only: the release workflow calls this workflow, and the scan report to code
# scanning, which needs a write scope, lives in docker-scan-report.yml.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  # Called by the release workflow, which validates the tagged commit before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.arch }})
    # Each architecture is built and run natively, without emulation.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build \
            --platform "linux/$ARCH" \
            --build-arg Version="0.0.0-ci.${GITHUB_RUN_NUMBER}" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag elpaqueto:ci \
            --load \
            .
          docker image ls elpaqueto:ci

      - name: Check the image metadata
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          inspect() { docker image inspect elpaqueto:ci --format "$1"; }
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok: $1"; else echo "FAIL: $1: expected '$3', got '$2'"; fail=1; fi; }
          check "architecture" "$(inspect '{{.Architecture}}')" "$ARCH"
          check "user" "$(inspect '{{.Config.User}}')" "1654:1654"
          check "exposed ports" "$(inspect '{{json .Config.ExposedPorts}}')" '{"8080/tcp":{}}'
          check "volumes" "$(inspect '{{json .Config.Volumes}}')" '{"/data":{}}'
          check "stop signal" "$(inspect '{{.Config.StopSignal}}')" "SIGTERM"
          check "health check" "$(inspect '{{json .Config.Healthcheck.Test}}')" '["CMD-SHELL","wget -q --spider http://127.0.0.1:8080/health || exit 1"]'
          check "source label" "$(inspect '{{index .Config.Labels "org.opencontainers.image.source"}}')" "https://github.com/sputier/ElPaqueto"
          check "revision label" "$(inspect '{{index .Config.Labels "org.opencontainers.image.revision"}}')" "$GITHUB_SHA"
          check "licenses label" "$(inspect '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" "MIT"
          if docker run --rm --entrypoint sh elpaqueto:ci -c 'test -e /mkdir'; then
            echo "FAIL: stray /mkdir folder in the image"; fail=1
          else
            echo "ok: no stray /mkdir folder"
          fi
          exit "$fail"

      - name: Smoke test
        env:
          SMOKE_LOG_DIR: ${{ runner.temp }}/smoke-logs
        run: bash eng/docker/smoke-test.sh elpaqueto:ci

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke-logs/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save the image for the scan
        if: matrix.arch == 'amd64'
        run: docker save elpaqueto:ci -o "$RUNNER_TEMP/elpaqueto-image.tar"

      - name: Upload the image for the scan
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/elpaqueto-image.tar
          retention-days: 1
          if-no-files-found: error

  cross-build:
    name: cross-build (arm64 from amd64)
    # Proves the multi-platform build of the Dockerfile: the SDK stage runs on the build platform and
    # cross-compiles; only the runtime stage's package installation runs under QEMU.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install QEMU from the Ubuntu archive
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          # The handler must be registered with the F (fix binary) flag to work inside containers.
          grep -E '^flags: .*F' /proc/sys/fs/binfmt_misc/qemu-aarch64

      - name: Build for linux/arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg Version="0.0.0-ci.${GITHUB_RUN_NUMBER}" \
            --build-arg REVISION="$GITHUB_SHA" \
            --tag elpaqueto:ci-arm64 \
            --load \
            .
          test "$(docker image inspect elpaqueto:ci-arm64 --format '{{.Architecture}}')" = arm64

  scan:
    name: scan
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: ${{ runner.temp }}/image

      - name: Install Trivy and its vulnerability database
        run: bash eng/docker/scan-image.sh --prepare

      - name: Scan (fails on HIGH and CRITICAL findings that have a fix)
        run: bash eng/docker/scan-image.sh "$RUNNER_TEMP/image/elpaqueto-image.tar"

  samples:
    name: samples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Compose example and the reverse-proxy samples
        run: bash eng/docker/validate-proxy-samples.sh
