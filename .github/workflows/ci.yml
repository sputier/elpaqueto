name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the commit and secret checks inspect the pushed range.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ElPaqueto.sln

      - name: Select the commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          echo "HYGIENE_RANGE=$range" >> "$GITHUB_ENV"

      - name: Run hygiene checks
        env:
          # Optional maintainer-supplied patterns, kept out of the repository.
          HYGIENE_EXTRA_PATTERNS: ${{ vars.HYGIENE_EXTRA_PATTERNS }}
        run: python3 eng/hygiene/run_all.py --range "$HYGIENE_RANGE"

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test upstream port script
        shell: bash
        run: bash eng/tests/port-upstream.test.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Check formatting (strict projects)
        shell: bash
        run: bash eng/format-strict.sh

      - name: Test
        # The end-to-end tests (real server process, real dotnet CLI) run in the e2e job below.
        run: dotnet test --configuration Release --no-build --filter "Category!=EndToEnd" --logger trx --results-directory TestResults

      - name: Summarize test results
        if: always()
        shell: bash
        run: |
          total=0; executed=0; passed=0; failed=0; skipped=0
          shopt -s nullglob
          for f in TestResults/*.trx; do
            counters=$(grep -o '<Counters [^>]*>' "$f" | head -n 1)
            n() { printf '%s' "$counters" | sed -n "s/.* $1=\"\([0-9]*\)\".*/\1/p"; }
            total=$((total + $(n total)))
            executed=$((executed + $(n executed)))
            passed=$((passed + $(n passed)))
            failed=$((failed + $(n failed)))
            skipped=$((skipped + $(n notExecuted)))
          done
          {
            echo "### Test results (${{ matrix.os }})"
            echo
            echo "| Total | Executed | Passed | Failed | Skipped |"
            echo "|---|---|---|---|---|"
            echo "| $total | $executed | $passed | $failed | $skipped |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "executed=$executed" >> "$GITHUB_ENV"

      - name: Fail when no test was executed
        shell: bash
        run: |
          if [ "${executed:-0}" -eq 0 ]; then
            echo "No test was executed: test discovery is broken." >&2
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    # The published server as a child process, driven by the real dotnet CLI with isolated NuGet folders
    # (tests/ElPaqueto.EndToEnd.Tests, docs/technical/e2e-tests.md). Needs no secret: every password and
    # API key is generated by the tests and redacted from their output. One test restores the xunit
    # packages from nuget.org.
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: End-to-end tests
        run: >-
          dotnet test tests/ElPaqueto.EndToEnd.Tests --configuration Release --no-build
          --filter "Category=EndToEnd" --logger trx --results-directory TestResults
          --blame-hang --blame-hang-timeout 20m

      - name: Fail when no test was executed
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          executed=0
          for f in TestResults/*.trx; do
            n=$(grep -o '<Counters [^>]*>' "$f" | head -n 1 | sed -n 's/.* executed="\([0-9]*\)".*/\1/p')
            executed=$((executed + ${n:-0}))
          done
          echo "### End-to-end tests (${{ matrix.os }}): $executed executed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$executed" -eq 0 ]; then
            echo "No end-to-end test was executed." >&2
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.os }}
          path: TestResults/
          retention-days: 7
          if-no-files-found: warn
